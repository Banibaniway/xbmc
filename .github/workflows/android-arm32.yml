name: Android ARM32 APK

# Build Kodi 22.0rc1 + GUI fix for 32-bit ARM (Fire TV 4K Max gen 1).
# Runs on every push to this branch. The APK is uploaded as an artifact.

on:
  workflow_dispatch:
  push:
    branches: [fix-black-gui-surface]

env:
  NDK_VERSION: "28.2.13676358"
  TOOLS: ${{ github.workspace }}/../android-tools
  HOST: arm-linux-androideabi

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          sudo apt-get clean
          df -h /

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf bison build-essential curl flex gawk gperf libcurl4-openssl-dev unzip zip zlib1g-dev lib32stdc++6 lib32z1 cmake ninja-build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK + NDK
        run: |
          mkdir -p "$TOOLS"
          SDK="$TOOLS/android-sdk-linux"
          mkdir -p "$SDK"
          curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools-tmp"
          mkdir -p "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools-tmp/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" platform-tools "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION"
          mkdir -p ~/.android
          keytool -genkey -keystore ~/.android/debug.keystore -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keypass android -storepass android -keyalg RSA -keysize 2048 -validity 10000 || true

      - name: Build dependencies
        run: |
          set -o pipefail
          trap 'm=$(tail -n 40 /tmp/depends.log | sed ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=depends failed::$m"' ERR
          cd tools/depends
          ./bootstrap
          ./configure --with-tarballs="$TOOLS/xbmc-tarballs" --host=$HOST \
            --with-sdk-path="$TOOLS/android-sdk-linux" --prefix="$TOOLS/xbmc-depends" \
            --enable-debug=no --disable-ccache
          make -j"$(nproc)" 2>&1 | tee /tmp/depends.log
          grep -q "Dependencies built successfully" /tmp/depends.log

      - name: Configure Kodi
        run: |
          mkdir -p "$HOME/kodi-build"
          set +e
          make -C tools/depends/target/cmakebuildsys BUILD_DIR="$HOME/kodi-build" > /tmp/cmake.log 2>&1
          rc=$?
          echo "cmake rc=$rc"
          exit $rc

      - name: Diagnostics (python)
        if: failure()
        run: |
          set +e
          {
            echo "--- python lines in cmake.log"; grep -i python /tmp/cmake.log | head -20
            echo "--- python lines in depends.log"; grep -i python /tmp/depends.log | tail -15
            echo "--- prefix"; ls "$TOOLS/xbmc-depends"
            echo "--- python files"; find "$TOOLS/xbmc-depends" \( -iname "libpython*" -o -name Python.h -o -name "python3*.pc" \) 2>/dev/null | head -10
            echo "--- cmake tail"; tail -n 15 /tmp/cmake.log
            echo "--- CMakeError"; tail -n 20 "$HOME/kodi-build/CMakeFiles/CMakeError.log" 2>/dev/null
          } > /tmp/diag.txt 2>&1
          m=$(sed ':a;N;$!ba;s/\n/%0A/g' /tmp/diag.txt)
          echo "::error title=cmake diag::$m"

      - name: Build Kodi
        run: |
          set -o pipefail
          trap 'm=$(tail -n 60 /tmp/kodi.log | sed ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=kodi build failed::$m"' ERR
          cd "$HOME/kodi-build"
          make -j"$(nproc)" 2>&1 | tee /tmp/kodi.log

      - name: Package APK
        run: |
          set -o pipefail
          trap 'm=$(tail -n 60 /tmp/apk.log | sed ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=apk failed::$m"' ERR
          cd "$HOME/kodi-build"
          make apk 2>&1 | tee /tmp/apk.log
          echo "::notice title=apk files::$(find / -name '*.apk' -size +1M 2>/dev/null | head -10 | tr '\n' ' ')"

      - name: Collect APK
        run: |
          mkdir -p /tmp/out
          find "$HOME/kodi-build" "$GITHUB_WORKSPACE" -name "*.apk" -exec cp {} /tmp/out/ \;
          ls -l /tmp/out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kodi-22.0rc1-arm32-fix-black-gui
          path: /tmp/out/*.apk
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /tmp/*.log
          if-no-files-found: ignore
